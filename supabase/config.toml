# Supabase local development config
# Docs: https://supabase.com/docs/guides/cli/config

[project]
project_id = "your-project-id"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = false
# Realtime is disabled — NamFlix does not use Supabase realtime.
# All refresh is pull-based (SWR on Next.js, Timer.periodic on Flutter).

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = false
# NamFlix does not use Supabase storage.

[auth]
enabled = true
site_url = "https://namflix.info"
additional_redirect_urls = [
  "https://namflix.info",
  "https://namflix.info/auth/callback",
  "namflix://auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = false
# Email confirmation disabled for faster onboarding.
# Set enable_confirmations = true in production if you want verified emails.
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.google]
enabled = true
# Set these via Supabase dashboard or environment:
# client_id = env(GOOGLE_CLIENT_ID)
# secret = env(GOOGLE_SECRET)
# redirect_uri is automatically: https://your-project.supabase.co/auth/v1/callback

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.sync-iptv-data]
verify_jwt = false
# JWT verification off — this function uses X-Cron-Secret instead.

[functions.get-user-country]
verify_jwt = false
# JWT verification off — called before the user is authenticated.

[analytics]
enabled = false
