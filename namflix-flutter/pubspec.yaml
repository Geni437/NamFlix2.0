name: namflix
description: NamFlix — Global Live TV Streaming
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Auth & backend
  supabase_flutter: ^2.0.0
  dio: ^5.0.0

  # State + navigation
  flutter_bloc: ^8.1.0
  go_router: ^13.0.0
  equatable: ^2.0.5

  # Video
  better_player: ^0.0.83

  # Cache
  hive_flutter: ^1.1.0

  # Deep links
  app_links: ^6.0.0

  # UI
  google_fonts: ^6.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  share_plus: ^7.0.0
  package_info_plus: ^9.0.0

  # In-app purchases (Google Play + App Store)
  in_app_purchase: ^3.0.0

  # Timezone & date formatting
  flutter_timezone: ^3.0.0
  intl: ^0.20.0

  # Serialization
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  generate: true
