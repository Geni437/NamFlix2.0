name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'namflix-flutter/**'
  workflow_dispatch:

jobs:
  build:
    name: Flutter Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: namflix-flutter
        run: flutter pub get

      - name: Analyze code
        working-directory: namflix-flutter
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: namflix-flutter
        run: flutter test

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > namflix-flutter/android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > namflix-flutter/android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Build release APK
        working-directory: namflix-flutter
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=LARAVEL_API_URL=${{ secrets.LARAVEL_API_URL }} \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Build release App Bundle (for Play Store)
        working-directory: namflix-flutter
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=LARAVEL_API_URL=${{ secrets.LARAVEL_API_URL }} \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' namflix-flutter/pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Built version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NamFlix v${{ steps.version.outputs.version }}
          body: |
            ## NamFlix v${{ steps.version.outputs.version }}

            ### Downloads
            - **APK** — direct install (sideload)
            - **AAB** — upload to Google Play Console

            ### Changelog
          files: |
            namflix-flutter/build/app/outputs/flutter-apk/app-release.apk
            namflix-flutter/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          draft: false
          prerelease: false
