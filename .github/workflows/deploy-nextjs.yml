name: Build and Deploy Next.js to Namecheap

on:
  push:
    branches: [main]
    paths:
      - 'namflix-frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build → FTP Upload
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: namflix-frontend/package-lock.json

      - name: Install dependencies
        working-directory: namflix-frontend
        run: npm ci

      - name: Build static export
        working-directory: namflix-frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build
        # next.config.js has output: 'export' → produces namflix-frontend/out/

      - name: Deploy to Namecheap via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: namflix-frontend/out/
          server-dir: /public_html/
          # Excludes: do not delete .htaccess on the server if not in out/
          exclude: |
            **/.git*
            **/.git*/**
